name: swift-nio-http3 integration tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  toolchains:
    name: Toolchains
    uses: swiftlang/github-workflows/.github/workflows/toolchain_matrix.yml@0.0.18
    with:
      linux_swift_versions: '["6.4", "nightly-release", "nightly-main"]'

  integration-tests:
    name: Integration tests
    needs: toolchains
    uses: swiftlang/github-workflows/.github/workflows/execute_matrix.yml@0.0.18
    with:
      name: "swift-nio-http3 integration tests"
      matrix_yaml_string: ${{ needs.toolchains.outputs.matrix_yaml }}
      setup_command: |
        git clone --depth 1 https://github.com/apple/swift-nio-http3.git ../swift-nio-http3
        swift package --package-path ../swift-nio-http3 edit swift-nio-quic --path "$(pwd)"
      command: swift test --package-path ../swift-nio-http3 --filter H3IntegrationTests
