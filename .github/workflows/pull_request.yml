name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.18
    with:
      api_breakage_check_container_image: "swift:6.4"
      license_header_check_project_name: "SwiftNIO"
      docs_check_container_image: "swift:6.4"
      format_check_container_image: "swift:6.4"

  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@0.0.18
    with:
      name: tests

      # Linux
      linux_command: |
        Test: swift test
        Release-Build: swift build -c release
      linux_version_overrides: |
        default: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error
        nightly-main: --explicit-target-dependency-import-check error
      linux_static_sdk_versions: '["current", "nightly-main"]'

      # macOS
      macos_swift_versions: '["6.4"]'
      macos_xcode_versions: '["latest-beta"]'
      macos_runner_pool: general
      xcode_scheme: swift-nio-quic-Package
      xcode_targets: '[macOS, iOS, watchOS, tvOS, visionOS]'

      # Not run by this package.
      enable_windows: false
      enable_macos_swiftly: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: false
      enable_android_sdk_build: false
      enable_freebsd: false

  http3-integration-tests:
    name: swift-nio-http3 integration tests
    uses: ./.github/workflows/http3_integration_tests.yml
